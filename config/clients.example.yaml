# Autorisierungs-Config: pro Client (identifiziert über den CN seines
# mTLS-Client-Zertifikats) wird explizit festgelegt, welche Operationen
# er auf welchen Key-Labels ausführen darf.
#
# Prinzip: Default-Deny. Ein Client, der hier nicht auftaucht, wird
# abgelehnt, bevor überhaupt eine PKCS#11-Session geöffnet wird.
# Ein Client, der auftaucht, darf NUR die hier gelisteten
# (operation, key_label)-Kombinationen — nichts sonst, und insbesondere
# keine Objekt-Management-, Backup- oder Verwaltungsoperationen, da
# dieser Dienst dafür schlicht keine Funktionen bereitstellt (siehe
# README.md, Abschnitt "Bewusst nicht enthalten").

clients:
  - cn: "app-a.internal.example"
    description: "Beispiel: darf nur mit einem gemeinsamen Encryption-Key ver-/entschlüsseln"
    permissions:
      - operation: encrypt
        key_labels: ["shared-encryption-key"]
      - operation: decrypt
        key_labels: ["shared-encryption-key"]

  - cn: "app-b.internal.example"
    description: "Beispiel: darf nur mit ihrem eigenen Key signieren/verifizieren"
    permissions:
      - operation: sign
        key_labels: ["app-b-signing-key"]
      - operation: verify
        key_labels: ["app-b-signing-key"]

  - cn: "app-c.internal.example"
    description: "Beispiel: Key-Derivation fuer ein einzelnes Wrapping-Szenario"
    permissions:
      # Wrappen und Entwrappen sind getrennte Operationen. Ein Client, der
      # Schluesselmaterial nur einpacken soll, bekommt nur
      # derive_and_encrypt — das Gegenstueck hier bewusst weglassen.
      - operation: derive_and_encrypt
        key_labels: ["app-c-derive-key"]
        # SICHERHEITSKRITISCH und deshalb Pflicht bei beiden
        # derive_and_*-Operationen: Nur diese
        # Public Keys der Gegenseite duerfen fuer ECDH1_DERIVE verwendet
        # werden. Ein frei waehlbarer Peer-Key waere fatal — ECDH ist
        # symmetrisch, der Client koennte den abgeleiteten Wrapping-Key
        # selbst nachrechnen (Hardware-Bindung wertlos) und ueber
        # Invalid-Curve-Anfragen den privaten Schluessel aus dem HSM
        # rekonstruieren.
        #
        # Wert erzeugen (Public Key der Gegenseite, gleiche Bytes wie fuer
        # `pkcs11-tool --derive -i <datei>`):
        #   openssl ec -in peer.pem -pubout -outform DER | base64 -w0
        #
        # Jeder Eintrag muss vom Betreiber geprueft sein: dass er auf der
        # erwarteten Kurve liegt und tatsaechlich zur vorgesehenen
        # Gegenstelle gehoert.
        # Platzhalter (dekodiert zu "REPLACE-WITH-REAL-PEER-PUBLIC-KEY").
        # Bewusst gueltiges Base64, damit diese Beispieldatei fuer den
        # Quickstart in README.md Abschnitt 5 ladbar bleibt — mit diesem
        # Wert schlaegt jeder echte derive-Aufruf fehl, was gewollt ist.
        peer_public_keys:
          - "UkVQTEFDRS1XSVRILVJFQUwtUEVFUi1QVUJMSUMtS0VZ"
