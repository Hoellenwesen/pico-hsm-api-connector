[package]
name = "pico-hsm-api-connector"
version = "0.1.0"
edition = "2021"
description = "Network API gateway for Pico-HSM crypto operations with mTLS client auth and key scoping. Management operations (backup, firmware update, object management) are intentionally NOT part of this API."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"

cryptoki = "0.12"
x509-parser = "0.16"

serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

zeroize = "1"
rand = "0.8"

sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"
thiserror = "2"

[profile.release]
strip = true
